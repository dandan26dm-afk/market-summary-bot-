name: סיכום שוק יומי לדיסקורד

on:
  schedule:
    # 17:00 שעון ישראל, ימים שני-שישי. GitHub מטפל בעצמו בשעון קיץ/חורף.
    - cron: "0 17 * * 1-5"
      timezone: "Asia/Jerusalem"
    - cron: "7 * * * *"       # בדיקה זמנית: כל שעה, שולח תמיד (למחוק בסוף)
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית ובדיקה
permissions:
  contents: read
  actions: write              # בשביל השלב האחרון ששומר על התזמון פעיל

concurrency:
  group: market-summary
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: התקנות
        run: |
          pip install -U -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji
          python -m playwright install --with-deps chromium

      - name: בניית התמונה ושליחה לדיסקורד
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ריצת הבדיקה (כל שעה) מתנהגת כמו ריצה ידנית: שולחת תמיד, גם כשהבורסה סגורה
          TRIGGER_SCHEDULE: ${{ github.event.schedule != '7 * * * *' && github.event.schedule || '' }}
        run: python market_bot.py

      - name: שמירת עותק של התמונה (7 ימים)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-summary
          path: market_summary.png
          if-no-files-found: ignore
          retention-days: 7

      - name: הודעה לדיסקורד אם משהו נכשל
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "import json,os;print(json.dumps({'content':'⚠️ בוט סיכום השוק נכשל היום. פרטים: '+os.environ['RUN_URL']}))" > msg.json
          curl -s -H "Content-Type: application/json" -d @msg.json "$DISCORD_WEBHOOK_URL"

      - name: שמירה על התזמון פעיל
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/market-summary.yml/enable"
